    <div class="container"><h1>My Wishlist</h1><p>Events you've saved for later</p></div>

  <script src="js/booking.js" defer></script>
  <script src="js/main.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function() {
    if (!Auth.guard()) return;
    var container = document.getElementById('wishlistContent');
    var allEvents = await Utils.fetchJSON('data/events.json');
    Utils.setStorage('cachedEvents', allEvents);

    function renderWishlist() {
      var favorites = Events.getFavorites();
      var favEvents = allEvents.filter(function(e) { return favorites.indexOf(e.id) !== -1; });

      if (favEvents.length === 0) {
        container.innerHTML =
          '<div class="ev-empty">' +
            '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
            '<h3>Your wishlist is empty</h3>' +
            '<p>Save events you love by clicking the heart icon on any event card.</p>' +
            '<a href="events.html" class="btn btn--primary">Browse Events</a>' +
          '</div>';
        return;
      }

      container.innerHTML =
        '<p style="font-size:14px;color:var(--text-secondary);margin-bottom:24px;">' + favEvents.length + ' event' + (favEvents.length !== 1 ? 's' : '') + ' saved</p>' +
        '<div class="events-grid" id="wishGrid"></div>';
      Events.renderGrid('wishGrid', favEvents);
      var grid = document.getElementById('wishGrid');
      grid.querySelectorAll('.event-card__save').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (!Events.isFav(parseInt(btn.dataset.id))) renderWishlist();
        });
      });
    }

    renderWishlist();
  });
  </script>
